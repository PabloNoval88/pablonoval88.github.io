<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <title>Title</title>
          <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/p5.min.js"></script>
    </head>
    <body>
     <script>
  // A1 — Reutilización: añade movimiento con variables (sin condicionales)

  // Estado del objeto que se moverá (elige: coche, nube, sol…)
  let x, y, v, d, r; // usa las que necesites

  function setup() {
    createCanvas(900, 500);

    // 1) Tamaños relativos
    d = min(width, height) * 0.16;
    r = d / 2;

    // 2) Posición inicial relativa (evita números mágicos)
    x = -r;              // empieza entrando
    y = height * 0.12;   // por ejemplo, altura de una carretera

    // 3) Velocidad relativa al ancho
    v = width / 500;
  }
            
function draw() {
        createCanvas(400,400);
        background(87,161,245);
    
        noFill();
        stroke(255,0,0)
        strokeWeight(22)
        arc(200,390,390,390,PI,0)
        
        noFill();
        stroke(254,153,0)
        strokeWeight(22)
        arc(200,410,360,390,PI,0)
    
         noFill();
        stroke(255,255,100)
        strokeWeight(22)
        arc(200,430,330,390,PI,0)
    
        noFill();
        stroke(111,246,58)
        strokeWeight(22)
        arc(200,450,300,390,PI,0)
    
        noFill();
        stroke(55, 147, 254)
        strokeWeight(22)
        arc(200,470,270,390,PI,0)
    
         noFill();
        stroke(15, 7, 241)
        strokeWeight(22)
        arc(200,490,240,390,PI,0)
         
         noFill();
        stroke(200, 49, 251)
        strokeWeight(22)
        arc(200,510,210,390,PI,0)
        
        stroke(0,0,0);
        strokeWeight(3);
        fill(200);
        rect(169, 109, 182, 382);
    
        
        fill(0,0,0,100);
        rect(239,329,51,73);
        
        fill(255,255,100)
        ellipse(x,y,d);
        x=x+v;
         
       
        fill(156,204,255);
        rect(195,145,50,50);   
         
        fill(156,204,255);
        rect(275,145,50,50);
        
        fill(156,204,255);
        rect(195,225,50,50);   
    
         fill(156,204,255);
        rect(275,225,50,50); 
         
        
}
        </script>
    </body>
</html>
