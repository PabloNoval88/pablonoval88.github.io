<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <title>T10-dia y noche</title>
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/p5.min.js"></script>
    </head>
    <body>
        <script>
         // Variables
        let xS, yS, dS, rS, vS; //sol
        let xL, yL, dL, rL, vL;   // Luna
        let dia, mes, año;
        function setup() {
            createCanvas(900, 500);
            dS = 0.1 * width;    // diámetro del Sol (relativo al ancho)
            rS = dS / 2;
            yS = 0.2 * height;   // altura relativa
            xS = -rS;            // arranca entrando por la izquierda
            vS = width / 400;    // velocidad proporcional al ancho
         
            // Luna (mitad del Sol)
            dL = dS * 0.8; 
            rL = dL /0.5;
            xL = -width - rL; 
            yL = height / 3; // altura distinta para distinguirla 
            vL = vS; // misma velocidad
            
            dia = 1;
            mes = 1;
            año = 2026;
        }

        function draw() {
            if (xS <= width + rS) {
            // Día mientras el borde izquierdo del Sol no ha salido por la derecha
                background(130, 206, 300); //azul
            } else {
            // Noche cuando el Sol ya salió completamente por la derecha
                background(0); //negro
            }

            // 3.2 Suelo (decoración)
            noStroke();
            fill(20, 120, 40);
            rect(0, 0.8 * height, width, 0.2 * height);

            // 3.3 Sol (si está fuera, no se verá)
            noStroke()
            fill(255, 210, 0);
            circle(xS, yS, dS);
            
            //Luna
            noStroke(); 
            fill(200);
            circle(xL, yL, dL)
            
            noStroke();//sin trazo

          if (xS <= width + rS) { 
         fill(0);    } 
          else { 
            fill(255); } 
        textSize(20);
        text("Fecha: (" + dia + ") (" + mes + ") (" + año + ")", 10, 20);

            // 3.4 Movimiento constante
            xS = xS + vS;
            xL = xL + vL;

            // 3.5 Reinicio por posición (noche suficientemente larga)
            if (xS > 2 * width + rS) {
                xS = -rS;
                xL = -width - rL;

                dia = dia + 1;

                if (dia > 30) {
                    dia = 1;
                    mes = mes + 1;
                }

                if (mes > 12) {
                    mes = 1;
                    año = año + 1;
                }
                
            //Muestra de variables
            textSize(14);
            stroke(255, 0, 0);
            fill(255);
            text(xS, 10, 10);
            text(xL, 10, 28);
            }
        } 
        </script>
    </body>
</html>
